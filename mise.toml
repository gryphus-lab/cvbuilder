[tools]
python = "3.13"
uv = "latest"
ruff = "latest"

[env]
CPATH = "/opt/homebrew/include"
LDFLAGS = "-L/opt/homebrew/lib"
LIBRARY_PATH = "/opt/homebrew/lib"
WEASYPRINT_DLL_DIRECTORIES = "/opt/homebrew/lib"
PROJECT_NAME = "{{ config_root | basename }}"
_.python.venv = { path = ".venv", create = true, uv_create_args = [
  "--system-site-packages",
] }
UV_PROJECT_ENVIRONMENT = ".venv"

[settings]
python.uv_venv_auto = "create|source"

[tasks.bootstrap]
description = "Install dependencies"
run = [
  'if [[ "$OSTYPE" == "darwin"* ]]; then ln -sf $(brew --prefix)/lib/* $(python -c "import sysconfig; print(sysconfig.get_path(\"stdlib\"))") >/dev/null 2>&1; fi',
  "uv pip install -r requirements.txt",
]

[tasks.info]
description = "Print project information"
run = '''
echo "Project: $PROJECT_NAME"
echo "Virtual Environment: $VIRTUAL_ENV"
'''

[tasks.parse]
description = "Parse CV PDF → results/cv_data.json"
run = "python main.py parse"
depends = ["bootstrap"]

[tasks.build]
description = "Build PDF from JSON data → default: results/cv.pdf"
run = "python main.py build"

[tasks.full]
description = "Parse + Build (full regeneration)"
run = ["python main.py parse", "python main.py build"]

[tasks.lint]
description = "Lint and check formatting with Ruff"
run = "ruff check . && ruff format --check ."
depends = ["bootstrap"]

[tasks.format]
description = "Format and fix code with Ruff"
run = "ruff format . && ruff check --fix ."
depends = ["bootstrap"]

[tasks.test]
description = "Run tests with pytest"
run = "pytest tests"
depends = ["bootstrap"]

[tasks.coverage]
description = "Run tests with coverage report"
run = "pytest tests --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml"
depends = ["bootstrap"]

[tasks.docker-build]
description = "Build the Docker image"
run = "docker build -t gryphus-lab/cvbuilder ."

[tasks.docker-parse-pdf]
description = "Parse PDF inside Docker"
run = 'docker run --rm -v "$PWD:/app" gryphus-lab/cvbuilder python main.py parse'
depends = ["docker-build"]

[tasks.docker-build-pdf]
description = "Build PDF inside Docker"
run = 'docker run --rm -v "$PWD:/app" gryphus-lab/cvbuilder python main.py build'
depends = ["docker-build"]

[tasks.docker-full-pdf]
description = "Full parse + build inside Docker"
run = 'docker run --rm -v "$PWD:/app" gryphus-lab/cvbuilder sh -c "python main.py parse && python main.py build"'
depends = ["docker-build"]

[tasks.docker-compose-up]
description = "Run docker-compose up using the Dockerfile"
run = "docker compose up --build -d"

[tasks.docker-compose-down]
description = "Run docker-compose down using the Dockerfile and clean up resources"
run = "docker compose down --volumes --remove-orphans --rmi all"
