services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_app
    ports:
      - "8080:8080"
    volumes:
      - ./results:/app/results:rw
      - ./config.json:/app/config.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: ["/app/.venv/bin/uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8080"]
