services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_app
    ports:
      - "8080:8080"
    volumes:
      - ./results:/app/results
      - ./config.json:/app/config.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    # Replace tail -f with the actual startup command
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8080"]
    stdin_open: true
    tty: true
