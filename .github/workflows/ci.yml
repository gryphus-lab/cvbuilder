# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI Workflow for cvbuilder with mise and SonarQube

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4.3.0
        with:
          install: true
          cache: true
      - name: Install system dependencies (Tesseract + WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-deu \
            poppler-utils \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            gcc
      - name: Check setup
        run: |
          mise --version
          mise doctor
      - name: Install dependencies
        run: |
          mise run bootstrap
      - name: Show project info
        run: |
          mise run info
      - name: Run Unit Tests with coverage
        run: mise run test:unit

      - name: Run Integration Tests
        run: mise run test:integration
      - name: Check for SonarQube token
        id: sonar_token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: SonarQube Scan
        # Dependabot runs cannot read repository secrets, so SONAR_TOKEN is
        # absent and the scan would 403. Skip the scan when no token is
        # available (incl. Dependabot), and never let an auth/scan issue block
        # the pipeline (code quality is advisory, not a merge gate).
        if: ${{ github.actor != 'dependabot[bot]' && steps.sonar_token.outputs.available == 'true' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
      runs-on: ubuntu-latest
      needs: build
      steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 0

        - name: Build Docker image
          run: docker build -t cvbuilder:latest .

        - name: Test Docker container (health check)
          run: |
            cid=$(docker run -d -p 8080:8080 cvbuilder:latest)
            trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
            for i in {1..30}; do
              if curl -fsS http://localhost:8080/healthz >/dev/null; then
                exit 0
              fi
              sleep 1
            done
            echo "Health check did not pass within timeout"
            exit 1
