# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI Workflow for cvbuilder with mise and SonarQube

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Install system dependencies (Tesseract + WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-deu \
            poppler-utils \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            gcc
      - name: Check setup
        run: |
          mise --version
          mise doctor
      - name: Install dependencies
        run: |
          mise run bootstrap
      - name: Show project info
        run: |
          mise run info
      - name: Run Unit Tests with coverage
        run: mise run test:unit

      # === INTEGRATION TESTS ===
      - name: Run Integration Tests
        run: mise run test:integration
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
      runs-on: ubuntu-latest
      needs: build
      steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0

        - name: Build Docker image
          run: docker build -t cvbuilder:latest .

        - name: Test Docker container (health check)
          run: |
            docker run --rm -p 8080:8080 cvbuilder:latest &
            sleep 5
            curl -f http://localhost:8080/healthz || exit 1
            kill %1