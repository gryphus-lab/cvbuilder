[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvbuilder"
version = "1.0.0"
description = "CV Parser and Builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Jinja2>=3.1.0,<4.0",
    "pdf2image>=1.16.0,<2.0",
    "pytesseract>=0.3.13,<1.0",
    "weasyprint>=68.1",
]
optional-dependencies = { test = ["pytest>=9.0.3", "pytest-cov>=6.2.1"] }

[tool.setuptools]
package-dir = {"." = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parser = ["./config.json"]