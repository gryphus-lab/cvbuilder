[project]
name = "cvbuilder"
version = "1.0.0"
description = "CV Parser and Builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.1",
    "httpx>=0.28.1,<1.0",
    "jinja2>=3.1.6,<4.0",
    "pdf2image>=1.17.0,<2.0",
    "pytesseract>=0.3.13,<1.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.2.1",
    "python-multipart>=0.0.28",
    "pyyaml>=6.0.3,<7.0",
    "uvicorn[standard]>=0.46.0",
    "weasyprint>=68.1",
]
optional-dependencies = { test = ["pytest>=9.0.3", "pytest-cov>=7.1.0"] }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parser = ["config.json"]

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"
